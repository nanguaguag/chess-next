name: chessroad
description: 棋路-中国象棋基于 flutter 的实现。
publish_to: "none"
version: 1.2.9+28

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  path_provider: ^2.1.5
  date_format: ^2.0.9
  package_info_plus: ^8.3.0
  flutter_linkify: ^6.0.0
  url_launcher: ^6.3.1
  in_app_review: ^2.0.10
  wakelock_plus: ^1.3.2
  flutter_easyloading: ^3.0.5
  kplayer: ^0.4.2
  app_links: ^6.4.0
  pikafish: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - images/logo.png
    - images/mei.png
    - images/zhu.png
    - images/qrcode.png
    - images/bg.jpg
    - images/room.png
    - images/nobody.png

    - assets/audios/bg_music.mp3
    - assets/audios/capture.mp3
    - assets/audios/check.mp3
    - assets/audios/click.mp3
    - assets/audios/regret.mp3
    - assets/audios/draw.mp3
    - assets/audios/tips.mp3
    - assets/audios/invalid.mp3
    - assets/audios/lose.mp3
    - assets/audios/move.mp3
    - assets/audios/win.mp3

    - assets/pikafish.nnue

  fonts:
    - family: ZhongSan
      fonts:
        - asset: fonts/sunzhongsan.ttf

    - family: QiTi
      fonts:
        - asset: fonts/qiti.ttf

    - family: XiaoLi
      fonts:
        - asset: fonts/hanyixiaoli.ttf
